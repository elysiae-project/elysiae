# yaml-language-server: $schema=https://raw.githubusercontent.com/flatpak/flatpak-builder/main/data/flatpak-manifest.schema.json

id: app.elysiae.Elysiae
command: Elysiae
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
writable-sdk: true

finish-args:
  - --socket=wayland
  - --socket=fallback-x11 # X11 is being dropped from DEs, but is generally expected to still be supported
  - --socket=pulseaudio # Audio for Proton-run games
  - --device=dri
  - --share=network # Game downloads + caching assets
  - --filesystem=home:create
  - --filesystem=xdg-desktop:create
  - --filesystem=xdg-data:create
  - --filesystem=xdg-config:create # Read existing game configs on host
  - --talk-name=org.freedesktop.portal.Desktop # Required for deep link support
  - --talk-name=org.freedesktop.portal.OpenURI # Also required for deep link support
modules:
  - name: Elysiae
    buildsystem: simple
    sources:
      - type: git
        url: https://github.com/elysiae-project/elysiae
        branch: main
      - ../../download-sources/cargo.json
    build-options:
      append-path: /usr/lib/sdk/rust-stable
      arch:
        x86-64:
          env:
            CARGO_BUILD_TARGET: x86_64-unknown-linux-gnu
            RUST_BACKTRACE: "1"
        aarch64:
          env:
            CARGO_BUILD_TARGET: aarch64-unknown-linux-gnu
            RUST_BACKTRACE: "1"
      env:
        HOME: /run/build/Elysiae
        CARGO_HOME: /run/build/Elysiae/cargo
        CARGO_NET_OFFLINE: "true"
        RUSTUP_HOME: /run/build/Elysiae/rustup
    build-commands:
      - cargo --offline fetch --manifest-path Cargo.toml --verbose
      - cargo --offline build --release --verbose
      - install -Dm755 target/${CARGO_BUILD_TARGET}/release/Elysiae /app/bin/Elysiae
      - install -Dm644 data/app.elysiae.Elysiae.desktop /app/share/applications/app.elysiae.Elysiae.desktop
      - install -Dm644 data/app.elysiae.Elysiae.metainfo.xml /app/share/metainfo/app.elysiae.Elysiae.metainfo.xml
      # TODO: Icon instlallation
      - install -Dm644 data/app.elysiae.Elysiae.gschema.xml /app/share/glib-2.0/schemas/app.elysiae.Elysiae.gschema.xml
      - glib-compile-schemas /app/share/glib-2.0/schemas
      