[package]
name = "Elysiae"
version = "1.0.0"
authors = ["The Elysiae Project"]
rust-version = "1.95.0"
edition = "2024"

[dependencies]
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_22", "gnome_50"] }

zstd = "0.14.4"
xz = "0.1.0"
flate2 = "1.1.11"
zip = "9.8.1"
tar = "0.4.46"
directories = "6.0.0"
anyhow = "1.0.105"
log = "0.4.35"
fs_extra = "1.3.0"
url = "2.5.9"
reqwest = { version = "0.13.5", features = ["json", "stream"] }
tokio = { version = "1.54.1", features = [
    "rt-multi-thread",
    "fs",
    "io-util",
    "rt",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
futures-util = "0.3.34"
uuid = { version = "1.29.3", features = ["v4"] }
sha256 = "1.6.0"
sysinfo = "0.40.4"
regex = "1.13.2"

irmin = { version = "1.2.0", package = "irmin_rs" }
libc = "0.2.191"
memfd = "0.6.6"
async-channel = "2.5.0"
ashpd = { version = "0.14.3", default-features = false, features = [
    "gtk4",
    "async-io",
    "account",
] }

[dev-dependencies]
whoami = "2.1.3"
rand = "0.10.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dev]
incremental = true
panic = "abort"

[build-dependencies]
glib-build-tools = "0.22.8"
