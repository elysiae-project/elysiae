name: Backend and packaging checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install meson ninja-build build-essential libfreetype-dev libgtk-4-dev llvm clang -y
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            
      - name: Run Tests (Debug)
        run: |
          mkdir build_debug
          meson setup build_debug -Dprofile=dev -Dtests=true -Dgui_tests=true 
          ninja -C build_debug test
      
      - name: Run Tests (Release)
        run: |
          mkdir build_release
          meson setup build_release -Dprofile=release -Dtests=true -Dgui_tests=true --prefix=/usr
          ninja -C build_release test
      
      - name: Test Installs
        run: |
          DESTDIR="$PWD/stage" meson install -C build_release --no-rebuild
          test -x stage/usr/bin/Elysiae
          test -f stage/usr/share/glib-2.0/schemas/app.elysiae.Elysiae.gschema.xml
          test -f stage/usr/share/icons/hicolor/scalable/apps/app.elysiae.Elysiae.svg
          test -f stage/usr/share/licenses/app.elysiae.Elysiae/LICENSE
          test -f stage/usr/share/Elysiae/fonts/OFL.txt
          test -f stage/usr/share/Elysiae/resources.gresource
          test ! -e stage/usr/share/icons/hicolor/scalable/actions/close.svg
          test ! -e stage/usr/share/icons/hicolor/scalable/actions/settings.svg