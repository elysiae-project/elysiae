name: Backend and packaging checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Get runner identity
        id: identity
        run: |
          echo "uid=$(id -u)" >> "$GITHUB_OUTPUT"
          echo "gid=$(id -g)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build CI container
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .github/ci/Dockerfile
          platforms: linux/${{ matrix.arch == 'x86_64' && 'amd64' || 'arm64' }}
          build-args: |
            CI_UID=${{ steps.identity.outputs.uid }}
            CI_GID=${{ steps.identity.outputs.gid }}
          tags: elysiae-ci
          load: true
          cache-from: type=gha,scope=elysiae-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=elysiae-${{ matrix.arch }},ignore-error=true

      - name: Save image for downstream jobs
        run: |
          docker save elysiae-ci | gzip -1 > elysiae-ci-${{ matrix.arch }}.tar.gz

      - name: Upload image artifact
        uses: actions/upload-artifact@v7
        with:
          name: elysiae-ci-${{ matrix.arch }}
          path: elysiae-ci-${{ matrix.arch }}.tar.gz
          compression-level: 0
          retention-days: 1

  test:
    needs: build-image
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
        profile: [debug, release]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Download architecture image
        uses: actions/download-artifact@v5
        with:
          name: elysiae-ci-${{ matrix.arch }}

      - name: Load image
        run: gzip -dc "elysiae-ci-${{ matrix.arch }}.tar.gz" | docker load

      - name: Run Meson tests
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            --workdir "$GITHUB_WORKSPACE" \
            --env HOME="$GITHUB_WORKSPACE/.ci-home" \
            --env BUILD_PROFILE="${{ matrix.profile }}" \
            elysiae-ci \
            bash -o pipefail -lc '
              set -e
              export LIBGL_ALWAYS_SOFTWARE=1
              export GTK_A11Y=none
              mkdir -p "$HOME"
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --no-modify-path
              export PATH="$HOME/.cargo/bin:$PATH"
              source "$HOME/.cargo/env"
              toolchain=$(sed -n "s/^channel = \"\(.*\)\"$/\1/p" rust-toolchain.toml)
              rustup install "$toolchain" --profile minimal
              rustup override set "$toolchain"
              if [ "$BUILD_PROFILE" = debug ]; then
                meson setup build -Dprofile=dev -Dtests=true -Dgui_tests=true
              else
                meson setup build -Dprofile=release -Dtests=true -Dgui_tests=true --prefix=/usr
              fi
              dbus-run-session -- xvfb-run -a ninja -C build test
              if [ "$BUILD_PROFILE" = release ]; then
                DESTDIR="$PWD/stage" meson install -C build --no-rebuild
                test -x stage/usr/bin/Elysiae
                test -f stage/usr/share/glib-2.0/schemas/app.elysiae.Elysiae.gschema.xml
                test -f stage/usr/share/icons/hicolor/scalable/apps/app.elysiae.Elysiae.svg
                test -f stage/usr/share/licenses/app.elysiae.Elysiae/LICENSE
                test -f stage/usr/share/Elysiae/fonts/OFL.txt
                test -f stage/usr/share/Elysiae/resources.gresource
                test ! -e stage/usr/share/icons/hicolor/scalable/settings-symbolic.svg
              fi
            '
